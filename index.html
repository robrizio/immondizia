<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSwipe</title>
    <style>
        :root { 
            --bg: #f8f9fa; --card: #ffffff; --text: #2c3e50; 
            --marrone: #795548; --blu: #2196f3; --giallo: #fbc02d; --verde: #4caf50; --grigio: #757575;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
            overflow-x: hidden; touch-action: pan-y;
        }
        
        /* Layout Mobile */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        header { padding: 15px; text-align: center; background: white; border-bottom: 1px solid #eee; }
        h1 { margin: 0; font-size: 1.2rem; color: #27ae60; }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 10px; }

        /* Blocchi Orizzontali */
        .panel { 
            background: var(--card); border-radius: 15px; padding: 15px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex: 1; display: flex; flex-direction: column;
        }
        .panel-top { border-bottom: 4px solid #e67e22; } /* Ecocentri */
        .panel-bottom { border-top: 4px solid #27ae60; } /* Abitazioni */

        .date-label { text-align: center; margin-bottom: 10px; }
        .date-label span { font-size: 0.8rem; text-transform: uppercase; color: #888; font-weight: bold; }
        .date-label h2 { margin: 0; font-size: 1.1rem; }

        .section-title { font-size: 0.75rem; font-weight: bold; color: #aaa; text-transform: uppercase; margin-bottom: 10px; display: block; }

        /* Dati */
        .item-list { overflow-y: auto; flex: 1; }
        .house-row { border-bottom: 1px solid #f0f0f0; padding: 8px 0; }
        .house-name { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; display: block; }
        
        .waste-badge { 
            display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 20px; 
            font-size: 0.8rem; color: white; font-weight: bold; margin-right: 5px; margin-bottom: 5px;
        }
        .bg-marrone { background: var(--marrone); }
        .bg-blu { background: var(--blu); }
        .bg-giallo { background: var(--giallo); color: #000; }
        .bg-verde { background: var(--verde); }
        .bg-grigio { background: var(--grigio); }
        .bg-none { background: #eee; color: #999; }

        .eco-row { background: #fffaf0; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #ffe0b2; }
        .eco-info { font-size: 0.9rem; font-weight: bold; }
        .eco-time { color: #e67e22; font-size: 0.85rem; }

        /* Footer Nav */
        .swipe-hint { text-align: center; padding: 10px; font-size: 0.7rem; color: #bdc3c7; }
    </style>
</head>
<body>

<div class="app-container" id="touch-zone">
    <header>
        <h1>♻️ EcoCalendario</h1>
    </header>

    <div class="main-content">
        <div class="panel panel-top">
            <div class="date-label">
                <span id="label-top">Oggi</span>
                <h2 id="date-top">-</h2>
            </div>
            <span class="section-title">🏭 Ecocentri Aperti</span>
            <div id="eco-list" class="item-list"></div>
        </div>

        <div class="panel panel-bottom">
            <div class="date-label">
                <span id="label-bottom">Domani</span>
                <h2 id="date-bottom">-</h2>
            </div>
            <span class="section-title">🏠 Rifiuti Abitazioni</span>
            <div id="house-list" class="item-list"></div>
        </div>
    </div>

    <div class="swipe-hint">⬅️ Scorri per cambiare giorno ➡️</div>
</div>

<script>
    let datiAbitazioni = [];
    let datiEcocentri = [];
    let currentOffset = 0;
    const giorniSett = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];

    // GESTIONE TOUCH
    let touchStartX = 0;
    let touchEndX = 0;

    document.getElementById('touch-zone').addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    });

    document.getElementById('touch-zone').addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });

    function handleSwipe() {
        if (touchStartX - touchEndX > 50) changeDate(1);  // Swipe Sinistra -> Avanti
        if (touchEndX - touchStartX > 50) changeDate(-1); // Swipe Destra -> Indietro
    }

    async function init() {
        try {
            const nc = "?v=" + new Date().getTime();
            const [resAb, resEco] = await Promise.all([
                fetch('abitazioni.json' + nc),
                fetch('ecocentri.json' + nc)
            ]);
            datiAbitazioni = await resAb.json();
            datiEcocentri = await resEco.json();
            render();
        } catch (e) { alert("Errore caricamento dati."); }
    }

    function getStyle(tipo) {
        const t = tipo.toUpperCase();
        if (t.includes("ORGANIC")) return { cls: "bg-marrone", ico: "🍎" };
        if (t.includes("PLASTICA")) return { cls: "bg-blu", ico: "🥤" };
        if (t.includes("CARTA")) return { cls: "bg-giallo", ico: "📦" };
        if (t.includes("VETRO")) return { cls: "bg-verde", ico: "🍾" };
        if (t.includes("SECCO") || t.includes("RESIDUO")) return { cls: "bg-grigio", ico: "🗑️" };
        return { cls: "bg-none", ico: "⚪" };
    }

    function render() {
        // Calcoliamo i due giorni
        const days = [currentOffset, currentOffset + 1];
        
        days.forEach((offset, idx) => {
            let d = new Date();
            d.setDate(d.getDate() + offset);
            const giornoNome = giorniSett[d.getDay()];
            const dataStr = d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });

            if (idx === 0) { // Pannello Superiore (Ecocentri)
                document.getElementById('label-top').innerText = offset === 0 ? "Oggi" : giornoNome;
                document.getElementById('date-top').innerText = `${giornoNome} ${dataStr}`;
                renderEcocentri(giornoNome);
            } else { // Pannello Inferiore (Abitazioni)
                document.getElementById('label-bottom').innerText = offset === 1 ? "Domani" : giornoNome;
                document.getElementById('date-bottom').innerText = `${giornoNome} ${dataStr}`;
                renderAbitazioni(giornoNome);
            }
        });
    }

    function renderEcocentri(giorno) {
        const container = document.getElementById('eco-list');
        const aperti = datiEcocentri.filter(e => e.giorno.trim().toLowerCase() === giorno.toLowerCase());
        container.innerHTML = aperti.length ? aperti.map(e => `
            <div class="eco-row">
                <div class="eco-info">📍 ${e.locazione}</div>
                <div class="eco-time">🕒 ${e.orario}</div>
            </div>
        `).join('') : '<p style="text-align:center;color:#ccc;font-size:0.8rem;">Nessun ecocentro aperto</p>';
    }

    function renderAbitazioni(giorno) {
        const container = document.getElementById('house-list');
        container.innerHTML = datiAbitazioni.map(casa => {
            const rifiuti = casa.calendario[giorno] || ["Nessuno"];
            const wasteHtml = rifiuti.map(r => {
                const s = getStyle(r);
                return `<span class="waste-badge ${s.cls}">${s.ico} ${r}</span>`;
            }).join('');
            return `
                <div class="house-row">
                    <span class="house-name">${casa.nome}</span>
                    <div>${wasteHtml}</div>
                </div>`;
        }).join('');
    }

    function changeDate(n) { currentOffset += n; render(); }
    init();
</script>
</body>
</html>
